services:
  - type: web
    name: cerdos-demo
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    repo: https://github.com/cracjuego454-glitch/cerdos-demo
    branch: main
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000